<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CastNight — 사전 등록</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+KR:wght@300;400;600;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          charcoal: '#0d0b14',
          midnight: '#141225',
          neonpurple: '#b26bff',
          neonpurple2: '#7c3aed',
          neonpink: '#ff5ec4',
        },
        fontFamily: {
          display: ['"Cinzel Decorative"', 'serif'],
          body: ['"Noto Sans KR"', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 20% 15%, rgba(124,58,237,0.25), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(255,94,196,0.15), transparent 40%),
      linear-gradient(180deg, #0d0b14 0%, #141225 55%, #0a0912 100%);
    background-attachment: fixed;
    color: #f5f3ff;
  }
  .glow-text {
    text-shadow: 0 0 12px rgba(178,107,255,0.8), 0 0 30px rgba(178,107,255,0.4);
  }
  .code-input {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(178,107,255,0.3);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .code-input:focus {
    outline: none;
    border-color: #b26bff;
    box-shadow: 0 0 0 3px rgba(178,107,255,0.18), 0 0 18px rgba(178,107,255,0.3);
  }
  .hidden { display: none !important; }
</style>
</head>
<body class="font-body min-h-screen flex items-center justify-center px-5 py-10">

  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="text-xs tracking-[3px] text-neonpurple font-semibold mb-2">🌙 CASTNIGHT</div>
      <h1 class="font-display text-2xl md:text-3xl text-white glow-text leading-snug">
        Cast your mask.
      </h1>
      <p class="text-sm text-purple-200/70 mt-3 leading-relaxed">
        얼굴보다 서사로 시작하는, 가면 롤플레이 소개팅<br />
        10월 30일, 할로윈에 열립니다.
      </p>
    </div>

    <div id="castnight-waitlist-form" style="padding: 26px 20px; background: rgba(25, 15, 40, 0.7); border: 1px solid rgba(232, 121, 249, 0.4); border-radius: 18px; backdrop-filter: blur(10px); box-shadow: 0 4px 24px rgba(121, 40, 202, 0.25);">

      <p class="text-sm text-purple-100/90 mb-4 text-center">가장 먼저 초대받고 싶다면, 지금 등록하세요.</p>

      <p class="text-xs text-purple-200/60 mb-2">성별</p>
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <button type="button" id="cn-gender-female" style="flex:1; padding:12px; border-radius:8px; border:1px solid rgba(178,107,255,0.4); background:transparent; color:#fff; cursor:pointer; font-size:14px;">여성</button>
        <button type="button" id="cn-gender-male" style="flex:1; padding:12px; border-radius:8px; border:1px solid rgba(178,107,255,0.4); background:transparent; color:#fff; cursor:pointer; font-size:14px;">남성</button>
      </div>

      <div id="cn-role-female" class="hidden" style="margin-bottom:16px;">
        <p class="text-xs text-purple-200/60 mb-2">선호 역할</p>
        <div style="display:flex; gap:8px;">
          <button type="button" id="cn-role-witch" style="flex:1; padding:12px; border-radius:8px; border:1px solid rgba(178,107,255,0.4); background:transparent; color:#fff; cursor:pointer; font-size:14px;">🌙 마녀</button>
          <button type="button" id="cn-role-hunter" style="flex:1; padding:12px; border-radius:8px; border:1px solid rgba(178,107,255,0.4); background:transparent; color:#fff; cursor:pointer; font-size:14px;">🏹 사냥꾼</button>
        </div>
      </div>

      <div id="cn-role-male" class="hidden" style="margin-bottom:16px;">
        <p class="text-xs text-purple-200/60 mb-2">선호 역할</p>
        <div style="display:flex; gap:8px;">
          <button type="button" id="cn-role-summon" style="flex:1; padding:12px; border-radius:8px; border:1px solid rgba(178,107,255,0.4); background:transparent; color:#fff; cursor:pointer; font-size:14px;">✨ 소환수</button>
          <button type="button" id="cn-role-vampire" style="flex:1; padding:12px; border-radius:8px; border:1px solid rgba(178,107,255,0.4); background:transparent; color:#fff; cursor:pointer; font-size:14px;">🩸 뱀파이어</button>
        </div>
      </div>

      <p class="text-xs text-purple-200/60 mb-2">이메일 주소</p>
      <input
        id="cn-email-input" type="email" placeholder="you@email.com" autocomplete="off"
        class="code-input" style="width:100%; box-sizing:border-box; border-radius: 9999px; padding: 13px 18px; font-size: 14px; color:#fff; margin-bottom: 14px;"
      />

      <p id="cn-error" class="hidden" style="font-size:12px; color:#ff5ec4; margin-bottom:12px; text-align:center;"></p>

      <button
        id="cn-submit-btn"
        type="button"
        style="display: block; width: 100%; padding: 15px 0; background: linear-gradient(135deg, #7928ca, #4f46e5); color: #ffffff; font-size: 15px; font-weight: 600; border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4); cursor: pointer;"
      >
        🌙 사전 등록하기
      </button>
    </div>

    <div id="castnight-waitlist-done" class="hidden" style="padding: 32px 24px; background: rgba(25, 15, 40, 0.7); border: 1px solid rgba(232, 121, 249, 0.4); border-radius: 18px; text-align:center; backdrop-filter: blur(10px); box-shadow: 0 4px 24px rgba(121, 40, 202, 0.25);">
      <p style="font-size:20px; font-weight:700; color:#e9d5ff; margin:0;">🌙 등록 완료!</p>
      <p style="font-size:14px; color:#c4b5fd; margin-top:10px;">할로윈, 당신의 가면을 준비할게요.</p>

      <div style="margin-top:20px; padding:16px; background:rgba(255,255,255,0.06); border:1px dashed rgba(178,107,255,0.5); border-radius:12px;">
        <p style="font-size:11px; color:#c4b5fd; letter-spacing:1px; margin:0 0 6px;">🔑 지금 바로 라운지 입장 코드</p>
        <p style="font-size:22px; font-weight:700; color:#fbbf24; letter-spacing:2px; margin:0;">NEO777</p>
      </div>

      <a
        href="./index.html"
        style="display:block; width:100%; box-sizing:border-box; margin-top:16px; padding: 15px 0; background: linear-gradient(135deg, #7928ca, #4f46e5); color: #ffffff; font-size: 15px; font-weight: 600; border-radius: 12px; text-decoration:none;"
      >
        🔮 네오타로에서 라운지 입장하기
      </a>
    </div>

    <p class="text-center text-xs text-purple-200/40 mt-8">
      이미 코드가 있으신가요? <a href="./index.html" class="underline text-purple-200/60">네오타로에서 입력하기</a>
    </p>
  </div>

<script>
  const CASTNIGHT_SUPABASE_URL = 'https://vwybarqglobrkuppgllx.supabase.co';
  const CASTNIGHT_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3eWJhcnFnbG9icmt1cHBnbGx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMzYwNTksImV4cCI6MjEwMDgxMjA1OX0.2eOO4qhPXsOFdzV2lzXOYXPyYWv1nrET9xDuXMDjPCY';

  const castnightWaitlistForm = document.getElementById('castnight-waitlist-form');
  const castnightWaitlistDone = document.getElementById('castnight-waitlist-done');
  const cnGenderFemaleBtn = document.getElementById('cn-gender-female');
  const cnGenderMaleBtn = document.getElementById('cn-gender-male');
  const cnRoleFemaleGroup = document.getElementById('cn-role-female');
  const cnRoleMaleGroup = document.getElementById('cn-role-male');
  const cnRoleWitchBtn = document.getElementById('cn-role-witch');
  const cnRoleHunterBtn = document.getElementById('cn-role-hunter');
  const cnRoleSummonBtn = document.getElementById('cn-role-summon');
  const cnRoleVampireBtn = document.getElementById('cn-role-vampire');
  const cnEmailInput = document.getElementById('cn-email-input');
  const cnError = document.getElementById('cn-error');
  const cnSubmitBtn = document.getElementById('cn-submit-btn');

  let cnGender = '';
  let cnRole = '';

  function showInlineError(el, msg) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  function hideInlineError(el) {
    el.classList.add('hidden');
  }

  function setCnGender(g) {
    cnGender = g;
    cnRole = '';
    cnGenderFemaleBtn.style.background = g === 'female' ? '#4c1d95' : 'transparent';
    cnGenderMaleBtn.style.background = g === 'male' ? '#4c1d95' : 'transparent';
    cnRoleFemaleGroup.classList.toggle('hidden', g !== 'female');
    cnRoleMaleGroup.classList.toggle('hidden', g !== 'male');
    [cnRoleWitchBtn, cnRoleHunterBtn, cnRoleSummonBtn, cnRoleVampireBtn].forEach((b) => { b.style.background = 'transparent'; });
  }

  function setCnRole(r) {
    cnRole = r;
    const map = { witch: cnRoleWitchBtn, hunter: cnRoleHunterBtn, summon: cnRoleSummonBtn, vampire: cnRoleVampireBtn };
    Object.values(map).forEach((b) => { b.style.background = 'transparent'; });
    map[r].style.background = '#4c1d95';
  }

  cnGenderFemaleBtn.addEventListener('click', () => setCnGender('female'));
  cnGenderMaleBtn.addEventListener('click', () => setCnGender('male'));
  cnRoleWitchBtn.addEventListener('click', () => setCnRole('witch'));
  cnRoleHunterBtn.addEventListener('click', () => setCnRole('hunter'));
  cnRoleSummonBtn.addEventListener('click', () => setCnRole('summon'));
  cnRoleVampireBtn.addEventListener('click', () => setCnRole('vampire'));

  cnSubmitBtn.addEventListener('click', async () => {
    const email = cnEmailInput.value.trim();
    hideInlineError(cnError);

    if (!email || !cnGender || !cnRole) {
      showInlineError(cnError, '이메일, 성별, 선호 역할을 모두 선택/입력해주세요.');
      return;
    }

    cnSubmitBtn.disabled = true;
    cnSubmitBtn.textContent = '등록 중...';

    try {
      const res = await fetch(`${CASTNIGHT_SUPABASE_URL}/rest/v1/waitlist`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': CASTNIGHT_ANON_KEY,
          'Authorization': `Bearer ${CASTNIGHT_ANON_KEY}`,
          'Prefer': 'return=minimal',
        },
        body: JSON.stringify({
          email,
          gender: cnGender,
          preferred_role: cnRole,
          source: 'neotarot_waitlist_page',
        }),
      });

      if (!res.ok) throw new Error('waitlist insert failed');

      castnightWaitlistForm.classList.add('hidden');
      castnightWaitlistDone.classList.remove('hidden');
    } catch (err) {
      showInlineError(cnError, '등록 중 문제가 발생했어요. 다시 시도해주세요.');
      cnSubmitBtn.disabled = false;
      cnSubmitBtn.textContent = '🌙 사전 등록하기';
    }
  });
</script>

</body>
</html>
